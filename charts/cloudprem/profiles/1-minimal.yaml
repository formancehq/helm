global:
  serviceHost: "example.com"

membership:
  config:
    auth:
      signingKey:
        # Provision this Secret in the release namespace before installation.
        existingSecret: membership-signing-key
        key: signing.key
  ingress:
    enabled: true
    tls:
      - secretName: example-com-wildcard-certificate-tls
  dex:
    ingress:
      enabled: true
      tls:
        - secretName: example-com-wildcard-certificate-tls

portal:
  ingress:
    enabled: true
    tls:
      - secretName: example-com-wildcard-certificate-tls
