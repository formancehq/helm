{{- if .Values.hooks.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "identity.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    {{- include "identity.hookAnnotations" . | nindent 4 }}
    helm.sh/hook-weight: "10"
    {{- with .Values.hooks.migration.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.hooks.migration.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.hooks.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.hooks.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "identity.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "identity.hookServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: identity
          image: {{ include "identity.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, dist/migrate.cjs]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.hooks.migration.resources | nindent 12 }}
          env:
            {{- include "identity.migrationSecretEnv" . | nindent 12 }}
          {{- with .Values.migrationVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
